<header class="topbar">
  <div class="wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}">Deepak Guntoju — Security Engineer</a>

      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>

      </span>
    </nav>
